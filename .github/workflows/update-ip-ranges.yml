name: Update IP Ranges

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 06:00 UTC
  workflow_dispatch:       # Allow manual runs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and aggregate IP ranges
        run: python scripts/fetch_and_aggregate.py

      - name: Aggregate and filter Russian ranges
        run: python scripts/aggregate.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ip-ranges-v4.txt ip-ranges-v6.txt ip-ranges-all.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update IP ranges $(date -u +%Y-%m-%d)"
            git push
          fi
